<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wellness+ Membership</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="container">
    <div class="left-section">
        <h2>Join Wellness+ Membership</h2>
        <ul>
            <li>🔥 10% OFF every order</li>
            <li>🚚 Free Express Delivery</li>
            <li>🎁 Monthly Freebie Box</li>
            <li>🔒 Early Access & Secret Sales</li>
        </ul>
        <button class="join-now">Join Now</button>
    </div>
    <div class="right-section">
        <div class="pricing-box">
            <span class="pricing-label">Best Value</span>
            <div class="pricing-option">
                <span class="duration">6 months</span>
                <span class="price">₹ 800/mo</span>
                <span class="save">SAVE 47%</span>
            </div>
            <div class="pricing-option">
                <span class="duration">12 months</span>
                <span class="price">₹ 800/mo</span>
                <span class="save">SAVE 47%</span>
            </div>
            <div class="total-price">
                <span class="total">₹ 8,000</span>
            </div>
        </div>
    </div>
</div>
</body>
</html>
<style>
    /* Reset some default styles */
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: Arial, sans-serif;
        background-color: #f5f5f5;
    }

    .container {
        display: flex;
        padding: 30px;
        background-color: #f8e4a2;
    }

    .left-section {
        flex: 1;
        padding-right: 20px;
    }

    h2 {
        font-size: 24px;
        font-weight: bold;
        margin-bottom: 20px;
    }

    ul {
        list-style: none;
        margin-bottom: 20px;
    }

    li {
        margin-bottom: 10px;
    }

    .join-now {
        padding: 12px 20px;
        background-color: #ff6a00;
        border: none;
        color: white;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
    }

    .join-now:hover {
        background-color: #e55b00;
    }

    .right-section {
        flex: 1;
        background-color: #ffffff;
        padding: 20px;
        border-radius: 8px;
    }

    .pricing-box {
        text-align: center;
    }

    .pricing-label {
        font-size: 18px;
        font-weight: bold;
        margin-bottom: 20px;
    }

    .pricing-option {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
    }

    .duration {
        font-size: 18px;
        font-weight: bold;
    }

    .price {
        font-size: 20px;
        font-weight: bold;
    }

    .save {
        font-size: 16px;
        color: green;
    }

    .total-price {
        font-size: 24px;
        font-weight: bold;
        margin-top: 20px;
    }

    .total {
        font-size: 22px;
        color: #ff6a00;
    }

</style>
